<div class="container mt-4">
  <h3 class="mb-3">My Appointments</h3>

  <table class="table table-bordered shadow">
    <thead class="table-dark">
      <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Mode</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let a of appointments">
        <td>{{a.appointmentDate}}</td>
        <td>{{a.slotTime}}</td>
        <td>{{a.mode}}</td>
        <td>{{a.status}}</td>
      </tr>
    </tbody>
  </table>
</div>
