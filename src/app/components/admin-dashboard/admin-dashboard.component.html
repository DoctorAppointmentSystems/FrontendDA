<div class="container mt-4">

  <h2 class="mb-4 text-primary">Admin Dashboard</h2>

  <!-- SUMMARY CARDS -->
  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow border-0 text-center p-4 dashboard-card">
        <h6 class="text-muted">Total Doctors</h6>
        <h2 class="text-primary">{{totalDoctors}}</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow border-0 text-center p-4 dashboard-card">
        <h6 class="text-muted">Total Appointments</h6>
        <h2 class="text-success">{{totalAppointments}}</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow border-0 text-center p-4 dashboard-card">
        <h6 class="text-muted">Today's Appointments</h6>
        <h2 class="text-danger">{{todayAppointments}}</h2>
      </div>
    </div>

  </div>

  <!-- RECENT APPOINTMENTS TABLE -->
  <div class="card mt-5 shadow">
    <div class="card-header bg-primary text-white">
      Recent Appointments
    </div>

    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Mode</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let a of appointments.slice(0,5)">
            <td>{{a.appointmentDate}}</td>
            <td>{{a.slotTime}}</td>
            <td>
              <span class="badge bg-info">{{a.mode}}</span>
            </td>
            <td>
              <span class="badge bg-success">{{a.status}}</span>
            </td>
          </tr>

          <tr *ngIf="appointments.length === 0">
            <td colspan="4" class="text-center text-muted">
              No appointments found
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
